CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_ZMK_BLE=y

# 启用 USB 连接 (有线模式和 ZMK Studio 必备)
CONFIG_ZMK_USB=y

# 蓝牙发射功率开到最大 (nRF52840 最大为 8dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 开启蓝牙实验性功能，优化连接稳定性 (部分手机/设备可能不兼容，改为 n)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# 明确设置蓝牙名称，方便在手机上识别
CONFIG_ZMK_KEYBOARD_NAME="MyZMK_KB"

# 每次重启自动清除配对记录 (已经清除了旧记录，现在改回 n，否则会导致配对中途重启时丢失记录)
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# 禁用蓝牙配对密码输入 (使用 Just Works 配对模式)
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# 强制使用 1M PHY (解决部分英特尔网卡因为 2M PHY 协商失败导致“请尝试重新连接设备”的报错)
CONFIG_BT_CTLR_PHY_2M=n

# ================================
# ZMK Studio 实时改键配置
# ================================
# 开启 ZMK Studio 支持
CONFIG_ZMK_STUDIO=y
# 默认解锁 ZMK Studio（无需在键盘上专门设置一个解锁按键，方便直接连接）
CONFIG_ZMK_STUDIO_LOCKING=n

# 增加 ZMK Studio RPC 缓冲区大小，防止传输物理布局时内存溢出导致重启
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512

# ================================
# 硬件外设配置 (编码器与屏幕)
# ================================
# 开启编码器支持
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 启用屏幕支持
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=n
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_16=y

# 启用标准 ZMK 组件
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# ================================
# RGB 底灯 (WS2812)
# ================================
# 开启 RGB 底灯控制
CONFIG_ZMK_RGB_UNDERGLOW=y
# 声明使用的是 WS2812 灯带驱动 (已在新版Zephyr中弃用，由设备树自动识别)
# CONFIG_WS2812_STRIP=y
# 默认开启底灯并设置初始亮度 (避免太亮耗电)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40

# 为底层屏幕测试分配内存
CONFIG_HEAP_MEM_POOL_SIZE=32768

# ================================
# 突破 6 键限制配置
# ================================
# 开启全键无冲，允许同时触发超过 6 个按键
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# 增加行为队列大小，防止宏序列长于 5 时被丢弃
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=64
