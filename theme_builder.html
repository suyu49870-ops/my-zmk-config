<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Theme Builder</title>
    <style>
        :root {
            --builder-bg: #0f1115;
            --sidebar-bg: #16181d;
            --border-color: #2a2d36;
            --accent: #0ea5e9;
            --text-main: #f3f4f6;
            --text-muted: #8b8b8b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--builder-bg);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .controls {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .control-group {
            margin-bottom: 24px;
        }
        .control-group-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }
        .control-item label {
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .control-item label span {
            color: var(--accent);
            font-weight: 600;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            background: var(--border-color);
            padding: 2px;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .action-btns {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #0284c7; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            margin-top: 10px;
        }
        .btn-outline:hover { background: rgba(14, 165, 233, 0.1); }

        .preview-area {
            flex: 1;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
            display: flex;
            flex-direction: column;
        }
        .preview-toolbar {
            height: 48px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: flex-end;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header">
            <h1>🎨 Theme Builder</h1>
            <p>实时微调并导出 CSS 样式</p>
        </div>
        <div class="controls">
            <!-- Colors -->
            <div class="control-group">
                <div class="control-group-title">颜色设定 (Colors)</div>
                <div class="control-item">
                    <label>主题色 (Accent) <span id="val-accent">#0ea5e9</span></label>
                    <input type="color" id="var-accent" data-var="--accent" value="#0ea5e9">
                </div>
                <div class="control-item">
                    <label>背景色 (Base BG) <span id="val-bg-base">#0a0a0a</span></label>
                    <input type="color" id="var-bg-base" data-var="--bg-base" value="#0a0a0a">
                </div>
                <div class="control-item">
                    <label>面板色 (Panel BG) <span id="val-bg-panel">#161616</span></label>
                    <input type="color" id="var-bg-panel" data-var="--bg-panel" value="#161616">
                </div>
                <div class="control-item">
                    <label>按键色 (Key BG) <span id="val-bg-key">#1c1c1c</span></label>
                    <input type="color" id="var-bg-key" data-var="--bg-key" value="#1c1c1c">
                </div>
            </div>

            <!-- Dimensions -->
            <div class="control-group">
                <div class="control-group-title">尺寸调节 (Dimensions)</div>
                <div class="control-item">
                    <label>弹窗边距调整 <span id="val-action-bar-mt">0px</span></label>
                    <input type="range" id="var-action-bar-mt" data-var="--action-bar-mt" data-unit="px" min="-20" max="20" value="0">
                </div>
                <div class="control-item">
                    <label>小键盘边距调整 <span id="val-macropad-mt">0px</span></label>
                    <input type="range" id="var-macropad-mt" data-var="--macropad-mt" data-unit="px" min="-20" max="20" value="0">
                </div>
            </div>
        </div>
        <div class="action-btns">
            <button class="btn" id="exportBtn">导出 CSS 代码</button>
            <button class="btn btn-outline" onclick="window.open('web_poc.html', '_blank')">新窗口打开主界面</button>
        </div>
    </div>
    
    <div class="preview-area">
        <div class="preview-toolbar">
            <span>预览分辨率: 自适应 (Iframe)</span>
        </div>
        <iframe id="previewIframe" src="web_poc.html"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('previewIframe');
        let cssOverrides = {};

        // Helper function to send css var update
        function updateVar(variable, value) {
            cssOverrides[variable] = value;
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    type: 'update-css-var',
                    variable: variable,
                    value: value
                }, '*');
            }
        }

        // Bind all inputs
        document.querySelectorAll('.controls input').forEach(input => {
            input.addEventListener('input', (e) => {
                const variable = e.target.getAttribute('data-var');
                const unit = e.target.getAttribute('data-unit') || '';
                const valStr = e.target.value + unit;
                
                // Update display label
                const label = document.getElementById('val' + e.target.id.replace('var', ''));
                if(label) label.textContent = valStr;

                updateVar(variable, valStr);
            });
        });

        // Initialize iframe with some dynamic vars to allow overriding explicitly defined values
        iframe.onload = () => {
            // Apply overrides on load
            Object.keys(cssOverrides).forEach(v => {
                updateVar(v, cssOverrides[v]);
            });
        };

        // Export CSS
        document.getElementById('exportBtn').addEventListener('click', () => {
            let cssCode = ":root {\\n";
            for(let key in cssOverrides) {
                cssCode += `    ${key}: ${cssOverrides[key]};\\n`;
            }
            cssCode += "}";
            navigator.clipboard.writeText(cssCode).then(() => {
                alert('CSS 代码已复制到剪贴板！可以直接覆盖到 web_poc.html 的 :root 区域。');
            });
        });
    </script>
</body>
</html>
